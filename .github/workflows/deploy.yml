name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Deploy only on green. These are the same checks CI runs; the job fails
      # here rather than publishing if any of them does.
      - run: npm run typecheck
      - run: npm test

      # npm run build runs the reproduction gate as a pre-step, and that gate
      # exits non-zero while dapil-2024.json is a placeholder (DECISIONS.md §1).
      # Vite is invoked directly so the placeholder can still be published, with
      # the app itself stating plainly that reproduction has not been verified.
      # Restore npm run build once the certified table lands.
      - name: Build
        run: npx vite build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
